<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">TeamDash</div>
        <div class="nav-links" id="navLinks">
            <a href="#hero">About</a>
            <a href="#wrong">Teem</a>
            <a href="#contact">Contact</a>
        </div>
        <button class="hamburger" id="hamburger">☰</button>
    </nav>

    <section id="hero" class="hero">
        <h1>Welcome to Our Team</h1>
        <button class="cta-button">Get Started</button>
    </section>

    <section id="team" class="team">
        <h2>Team Members</h2>
        <div class="team-grid">
            <div class="card"><h3>Alice</h3><p>Frontend Developer</p></div>
            <div class="card"><h3>Bob</h3><p>Backend Developer</p></div>
            <div class="card"><h3>Charlie</h3><p>UX Designer</p></div>
            <div class="card"><h3>Diana</h3><p>Product Manager</p></div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <form id="contactForm">
            <div class="form-group">
                <input type="text" id="name" placeholder="Your Name">
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Your Email">
            </div>
            <button type="submit" class="cta-button">Send Message</button>
            <p id="formMessage" class="form-message"></p>
        </form>
    </section>

    <footer class="footer">
        <p>&copy; 2014 TeamDash Inc. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
